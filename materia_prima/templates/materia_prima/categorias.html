{% extends "core/base.html" %}
{% block title %}Categorias{% endblock %}
{% block content %}
<h2 class="mb-4">Categorias de Insumos</h2>

<div class="card card-stat p-3 mb-4" style="max-width:500px;">
<form method="post" class="d-flex gap-2">
  {% csrf_token %}
  <input type="text" name="nombre" class="form-control" placeholder="Nueva categoria" required>
  <button type="submit" class="btn btn-primary">Agregar</button>
</form>
</div>

<div class="card card-stat p-3" style="max-width:500px;">
<ul class="list-group list-group-flush">
  {% for c in categorias %}
  <li class="list-group-item d-flex justify-content-between align-items-center">
    {{ c.nombre }}
    <form method="post" action="{% url "eliminar_categoria" c.pk %}">
      {% csrf_token %}
      <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
    </form>
  </li>
  {% empty %}
  <li class="list-group-item text-muted">No hay categorias registradas.</li>
  {% endfor %}
</ul>
</div>
{% endblock %}
