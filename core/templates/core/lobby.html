<!DOCTYPE html>
<html lang="es">
{% load static %}
<head>
<link rel="icon" type="image/png" href="{% static 'images/icons/icon-192x192.png' %}?v=3">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ datos_negocio.nombre }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: linear-gradient(135deg, #FBF6EE 0%, #E8D9C5 60%, #D9C4A8 100%);
  }
  .lobby-wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #4A3126;
    padding: 24px;
  }
  .lobby-icon {
    font-size: 3.5rem;
    margin-bottom: 16px;
    color: #A9744F;
  }
  .lobby-title {
    font-size: 2.2rem;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .lobby-slogan {
    font-size: 1.1rem;
    color: #8F5F3E;
    margin-bottom: 40px;
    max-width: 420px;
  }
  .btn-entrar {
    background-color: #4A3126;
    color: #FBF6EE;
    font-weight: 600;
    padding: 12px 40px;
    border-radius: 30px;
    font-size: 1.1rem;
    text-decoration: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 4px 20px rgba(74,49,38,0.25);
  }
  .btn-entrar:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 24px rgba(74,49,38,0.35);
    color: #FBF6EE;
  }
</style>
</head>
<body>
<div class="lobby-wrap">
  <div class="lobby-icon"><i class="bi bi-egg-fried"></i></div>
  <div class="lobby-title">{{ datos_negocio.nombre }}</div>
  <div class="lobby-slogan">Cada receta tiene un costo. Cada costo, una ganancia. Aqui los controlas todos.</div>
  <a href="{% url 'dashboard' %}" class="btn-entrar">Entrar <i class="bi bi-arrow-right ms-1"></i></a>
</div>
</body>
</html>
