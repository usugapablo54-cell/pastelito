{% extends "core/base.html" %}
{% block title %}Proveedor{% endblock %}
{% block content %}
<h2 class="mb-4">{% if proveedor %}Editar{% else %}Nuevo{% endif %} Proveedor</h2>
<div class="card card-stat p-4" style="max-width:600px;">
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Guardar</button>
</form>
</div>
{% endblock %}
